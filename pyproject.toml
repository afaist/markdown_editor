[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-editor"
description = "Простой редактор Markdown с предпросмотром и поддержкой LaTeX-формул"
dynamic = ["version"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "afaist (A.Zinovev)"}
]
keywords = ["markdown", "editor", "pyqt6", "latex", "katex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors :: Word Processors",
    "Topic :: Text Editors :: Text Editors",
]

dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "markdown>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/USER/markdown_editor"
Repository = "https://github.com/USER/markdown_editor"
Issues = "https://github.com/USER/markdown_editor/issues"

[project.scripts]
markdown-editor = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PIE", "LOG", "BLE", "S110", "EXE001"]
ignore = [
    "E402",      # module level import not at top (logger before imports)
    "E501",      # line too long
    "S110",      # try-except-pass (already fixed)
    "RUF001",    # ambiguous Unicode character in string
    "RUF002",    # ambiguous Unicode character in docstring
    "RUF003",    # ambiguous Unicode character in comment
    "N802",      # function name lowercase (PyQt overrides)
    "N815",      # variable mixedCase in class scope (PyQt slots)
    "BLE001",    # blind exception (file_operations has user-facing error messages)
    "SIM105",    # contextlib.suppress (style preference)
    "SIM108",    # ternary operator (style preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.setuptools]
packages = ["markdown_editor_pkg"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-timestamp"
