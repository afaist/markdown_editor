name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir ruff "PyQt6>=6.6.0,<6.9.0" "PyQt6-WebEngine>=6.6.0,<6.9.0" markdown pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir ruff mypy "PyQt6>=6.6.0,<6.9.0" "PyQt6-WebEngine>=6.6.0,<6.9.0" markdown
          mypy --version

      - name: Run ruff
        run: |
          ruff check markdown_editor_pkg/ tests/
          ruff format --check markdown_editor_pkg/ tests/

      - name: Run mypy
        run: |
          mypy markdown_editor_pkg/
