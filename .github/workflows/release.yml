name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим сборки'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: write
  actions: read

jobs:
  # ─── Linux сборка (tar.gz + deb + AppImage) ────────────────────────
  build-linux:
    if: github.event.inputs.mode == 'all' || github.event.inputs.mode == 'linux' || startsWith(github.ref, 'refs/tags/')
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            libgl1-mesa-glx \
            libegl1-mesa-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libfuse2 \
            dpkg-dev \
            patchelf

      - name: Install linuxdeploy
        run: |
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine markdown setuptools_scm

      - name: Download KaTeX resources
        run: python markdown_editor_pkg/download_katex.py

      - name: Download Prism.js resources
        run: python markdown_editor_pkg/download_prism.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm markdown-editor.spec

      - name: Package Linux binary (tar.gz)
        run: |
          cd dist
          tar -czf markdown-editor-linux-x86_64.tar.gz markdown-editor/

      - name: Get version helper
        id: getver
        run: |
          cat > /tmp/get_version.py << 'SCRIPTEND'
          import sys
          try:
              from setuptools_scm import get_version
              print(get_version())
          except Exception:
              print("0.0.0")
          SCRIPTEND

      - name: Package Linux binary (DEB)
        run: |
          chmod +x scripts/package_deb.sh
          mkdir -p dist/deb
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(python3 /tmp/get_version.py)
          fi
          VERSION="${VERSION#v}"
          ./scripts/package_deb.sh dist/markdown-editor dist/deb "$VERSION"

      - name: Package Linux binary (AppImage)
        run: |
          chmod +x scripts/package_appimage.sh
          mkdir -p dist/appimage
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(python3 /tmp/get_version.py)
          fi
          VERSION="${VERSION#v}"
          ./scripts/package_appimage.sh dist/markdown-editor dist/appimage "$VERSION"

      - name: Upload Linux artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-linux-x86_64
          path: dist/markdown-editor-linux-x86_64.tar.gz
          retention-days: 30

      - name: Upload Linux artifact (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-linux-x86_64-deb
          path: dist/deb/*.deb
          retention-days: 30

      - name: Upload Linux artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-linux-x86_64-appimage
          path: dist/appimage/*.appimage
          retention-days: 30

  # ─── Windows сборка ────────────────────────────────────────────────
  build-windows:
    if: github.event.inputs.mode == 'all' || github.event.inputs.mode == 'windows' || startsWith(github.ref, 'refs/tags/')
    name: Build Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine markdown setuptools_scm

      - name: Download KaTeX resources
        run: python markdown_editor_pkg\download_katex.py

      - name: Download Prism.js resources
        run: python markdown_editor_pkg\download_prism.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm markdown-editor.spec

      - name: Package Windows binary
        run: |
          Compress-Archive -Path dist\markdown-editor -DestinationPath dist\markdown-editor-win-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-win-x86_64
          path: dist/markdown-editor-win-x86_64.zip
          retention-days: 30

  # ─── Создание релиза ───────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Linux artifact (tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: markdown-editor-linux-x86_64
          path: release/

      - name: Download Linux artifact (DEB)
        uses: actions/download-artifact@v4
        with:
          name: markdown-editor-linux-x86_64-deb
          path: release/

      - name: Download Linux artifact (AppImage)
        uses: actions/download-artifact@v4
        with:
          name: markdown-editor-linux-x86_64-appimage
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: markdown-editor-win-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
